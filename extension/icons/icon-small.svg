<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 14 100 100">
  <!-- Chrome extension style: no background tile; the glyph is the icon.
       Artwork fits the central 96x96 (16px transparent margin at 128px). -->
  <defs>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="112">
      <stop offset="0" stop-color="#4b8eff"/>
      <stop offset="1" stop-color="#1a62e0"/>
    </linearGradient>
    <path id="arrow" d="M85 70 H97 V88 H106 L91 106 L76 88 H85 Z"/>
    <!-- transparent gap between the play shape and the arrow -->
    <mask id="gap">
      <rect width="128" height="128" fill="#fff"/>
      <use href="#arrow" fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
    </mask>
  </defs>
  <path d="M27 24 L27 98 L94 61 Z" fill="url(#fill)" stroke="url(#fill)" stroke-width="14" stroke-linejoin="round" mask="url(#gap)"/>
  <use href="#arrow" fill="url(#fill)" stroke="url(#fill)" stroke-width="4" stroke-linejoin="round"/>
</svg>
