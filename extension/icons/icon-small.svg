<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 104 104">
  <!-- A video screen with a play mark, and a big download arrow overlapping its corner. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="112" y2="112">
      <stop offset="0" stop-color="#1FC8B4"/><stop offset="1" stop-color="#0E8F9E"/>
    </linearGradient>
    <path id="arrow" d="M82 52 H98 V80 H110 L90 104 L70 80 H82 Z"/>
    <mask id="cut">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M38 40 L38 76 L66 58 Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
      <use href="#arrow" fill="#000" stroke="#000" stroke-width="16" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="16" y="22" width="84" height="72" rx="16" fill="url(#g)" mask="url(#cut)"/>
  <use href="#arrow" fill="url(#g)" stroke="url(#g)" stroke-width="5" stroke-linejoin="round"/>
</svg>
